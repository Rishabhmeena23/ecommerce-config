server:
  port: 8081

spring:
  application:
    name: auth-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: MyVerySecretKeyForEcommerceApplicationJWTAuthentication2026
  expiration: 86400000